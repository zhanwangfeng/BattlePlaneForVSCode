<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炸飞机 Demo</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0;
    --accent:#38bdf8; --head:#ef4444; --body:#22c55e; --miss:#64748b;
    --plane:#475569; --water:#1e293b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1e3a5f,var(--bg));
    color:var(--text); min-height:100vh; padding:24px 16px;
  }
  h1{text-align:center;font-size:24px;letter-spacing:2px;margin-bottom:4px;}
  .sub{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:18px;}
  .wrap{max-width:980px;margin:0 auto;}
  .status{
    text-align:center;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:15px;min-height:42px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .status b{color:var(--accent);}
  .boards{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;}
  .board-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .board-card h2{font-size:15px;text-align:center;margin-bottom:10px;font-weight:600;}
  /* 格子铺满整格(无逻辑间隙)，视觉间隙由内部 tile 的 inset 实现 */
  .board{display:grid;grid-template-columns:repeat(10,32px);grid-template-rows:repeat(10,32px);
    gap:0;background:#0b1426;padding:2px;border-radius:10px;}
  .cell{
    width:32px;height:32px;cursor:pointer;position:relative;
  }
  .cell .tile{position:absolute;inset:1px;border-radius:4px;background:var(--water);
    border:1px solid #2a3a52;transition:background .1s;}
  .cell:hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:2;}
  .cell.plane .tile{background:var(--body);}   /* 我方机身恒为绿色 */
  .cell.head .tile{background:var(--head);}      /* 我方机头恒为红色，与击中后同色 */
  .cell.miss .tile{background:var(--miss);}
  .cell.body .tile{background:var(--body);}
  .cell.hit-head .tile{background:var(--head);}
  .cell.reveal .tile{background:#3b4a63;}
  /* 命中机身 / 机头：在现有颜色上叠加叉叉（用 line 绘制） */
  .cell.body .tile, .cell.hit-head .tile{overflow:hidden;}
  .cell.body .tile::before, .cell.body .tile::after,
  .cell.hit-head .tile::before, .cell.hit-head .tile::after{
    content:""; position:absolute; left:50%; top:50%;
    width:78%; height:3px; border-radius:2px; background:#ffffff;
    transform-origin:center;
  }
  .cell.body .tile::before, .cell.hit-head .tile::before{ transform:translate(-50%,-50%) rotate(45deg); }
  .cell.body .tile::after,  .cell.hit-head .tile::after{ transform:translate(-50%,-50%) rotate(-45deg); }
  /* 机头命中叉叉用醒目黄色加粗 */
  .cell.hit-head .tile::before, .cell.hit-head .tile::after{
    background:#fde047; height:4px; box-shadow:0 0 3px rgba(0,0,0,.45);
  }
  /* 最后一次轰炸的格子：高亮边框 */
  .cell.last-shot{ z-index:3; }
  .cell.last-shot .tile{ border:2px solid #fbbf24; box-shadow:0 0 6px 1px rgba(251,191,36,.7); }
  .cell .dot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:#fff;pointer-events:none;z-index:1;}
  .cell.ghost-ok{outline:2px dashed var(--accent);outline-offset:-2px;z-index:2;}
  .cell.ghost-bad{outline:2px dashed #f87171;outline-offset:-2px;z-index:2;}
  /* 音效开关（固定右上角） */
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0;}
  button{
    background:var(--accent);color:#08233a;border:none;padding:10px 16px;border-radius:9px;
    font-size:14px;font-weight:600;cursor:pointer;transition:filter .15s,transform .05s;
  }
  button:hover{filter:brightness(1.1);}
  button:active{transform:translateY(1px);}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:12px;color:#94a3b8;margin-top:14px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:14px;height:14px;border-radius:3px;display:inline-block;position:relative;}
  /* 图例中「击中」图标的叉叉（与格子一致） */
  .swatch.cross::before, .swatch.cross::after{
    content:""; position:absolute; left:50%; top:50%;
    width:82%; height:2px; border-radius:1px; background:#fff; transform-origin:center;
  }
  .swatch.cross::before{ transform:translate(-50%,-50%) rotate(45deg); }
  .swatch.cross::after{ transform:translate(-50%,-50%) rotate(-45deg); }
  .swatch.cross.yellow::before, .swatch.cross.yellow::after{ background:#fde047; }
  .hint{text-align:center;color:#94a3b8;font-size:13px;margin-top:10px;}
  .win{font-size:20px;font-weight:700;}
  .win.win-yes{color:var(--body);}
  .win.win-no{color:var(--head);}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>

  <div class="status" id="status">阶段：布局 — 把 3 架飞机放到左侧战场</div>

  <div class="boards">
    <div class="board-card">
      <h2 id="leftTitle">我方战场</h2>
      <div class="board" id="playerBoard"></div>
    </div>
    <div class="board-card" id="enemyCard">
      <h2 id="rightTitle">敌方战场（未知）</h2>
      <div class="board" id="enemyBoard"></div>
    </div>
  </div>

  <div class="controls" id="setupControls">
    <button id="btnRotate"></button>
    <button id="btnRandom"></button>
    <button id="btnClear"></button>
    <button id="btnConfirm"></button>
  </div>
  <div class="controls" id="battleControls" style="display:none;">
    <button class="ghost" id="btnRestart"></button>
  </div>

  <div class="legend">
    <span><i class="swatch" style="background:var(--body)"></i><span id="legBody"></span></span>
    <span><i class="swatch" style="background:var(--head)"></i><span id="legHead"></span></span>
    <span><i class="swatch" style="background:var(--miss)"></i><span id="legMiss"></span></span>
    <span><i class="swatch cross" style="background:var(--body)"></i><span id="legHitBody"></span></span>
    <span><i class="swatch cross yellow" style="background:var(--head)"></i><span id="legHitHead"></span></span>
  </div>
  <div class="hint" id="hint">布局提示：点击格子放置当前飞机的「机头」，方向可旋转，飞机间可相邻但不可重叠。</div>
</div>

<script>
"use strict";
const SIZE = 10;
const NUM_PLANES = 3;

const BOOT = window.BOOTSTRAP || {};
let curLang = (BOOT.lang === 'en') ? 'en' : 'cn';
let curDict = (BOOT.dictCn && BOOT.dictEn) ? (curLang === 'en' ? BOOT.dictEn : BOOT.dictCn) : {};
function t(key, map){
  let s = (curDict && curDict[key] != null) ? curDict[key] : key;
  if (map) { for (const k in map) { s = s.split('{' + k + '}').join(String(map[k])); } }
  return s;
}
function setupStatusText(){
  if (placingIndex >= NUM_PLANES) return t('sp_all_placed');
  if (placingIndex === 0) return t('sp_status_setup_begin', { n: NUM_PLANES });
  return t('sp_status_setup_progress', { placed: placingIndex, n: NUM_PLANES });
}
function setText(id, s){ const el = document.getElementById(id); if (el) el.textContent = s; }
function updateSoundBtn(){ const b = document.getElementById('btnSound'); if (b) b.textContent = soundOn ? '🔊' : '🔇'; }
function applyStaticText(){
  document.documentElement.lang = (curLang === 'en') ? 'en' : 'zh-CN';
  setText('title', t('sp_title'));
  setText('sub', t('sp_sub', { n: NUM_PLANES }));
  setText('btnRotate', t('btn_rotate'));
  setText('btnRandom', t('btn_random'));
  setText('btnClear', t('btn_clear'));
  setText('btnConfirm', t('btn_confirm'));
  setText('btnRestart', t('btn_restart'));
  setText('legBody', t('legend_body'));
  setText('legHead', t('legend_head'));
  setText('legMiss', t('legend_miss'));
  setText('legHitBody', t('legend_hit_body'));
  setText('legHitHead', t('legend_hit_head'));
  updateSoundBtn();
}
function relocalize(){
  applyStaticText();
  if (phase === 'setup') {
    setText('leftTitle', t('sp_left_title'));
    setText('rightTitle', t('sp_right_unknown'));
    setText('hint', t('sp_hint_setup'));
    setStatus(setupStatusText());
  } else if (phase === 'battle') {
    setText('leftTitle', t('sp_my_attacking'));
    setText('rightTitle', t('sp_enemy_bomb'));
    setText('hint', t('sp_hint_battle'));
  } else {
    setText('leftTitle', t('sp_my_attacking'));
    const revealed = enemyShotByPlayer.some(function(row){ return row.indexOf('reveal') >= 0; });
    setText('rightTitle', revealed ? t('sp_reveal') : t('sp_enemy_bomb'));
    setText('hint', t('sp_hint_battle'));
    const eLeft = enemyPlanes.filter(function(p){ return !p.headHit; }).length;
    setStatus(eLeft === 0 ? '<span class="win win-yes">' + t('sp_win') + '</span>' : '<span class="win win-no">' + t('sp_lose') + '</span>');
  }
  renderAll();
}


// 飞机相对机头的偏移 [dRow, dCol]，机头在 (0,0)，机头朝上(机身向下延伸)
const PLANE_BASE = [
  [0,0],                                   // 机头
  [-2,1],[-1,1],[0,1],[1,1],[2,1],         // 机翼行
  [0,2],                                   // 机身
  [-1,3],[0,3],[1,3]                       // 尾翼行
];

function rotateOffset([dr,dc], rot){
  let r=dr, c=dc;
  for(let i=0;i<rot;i++){ const nr=-c, nc=r; r=nr; c=nc; }
  return [r,c];
}
// 返回某架飞机的全部格子（基于机头位置 headR,headC 与旋转 rot）
function planeCells(headR, headC, rot){
  return PLANE_BASE.map(([dr,dc])=>{
    const [r,c]=rotateOffset([dr,dc],rot);
    return [headR+r, headC+c];
  });
}

// ---- 状态 ----
let phase = "setup";            // setup | battle | over
let rotation = 0;               // 0..3
let placingIndex = 0;           // 当前正在放置第几架(0..2)
let playerPlanes = [];          // 已放置 {headR,headC,rot, cells:[[r,c]...], headHit:false}
let enemyPlanes = [];

// 我方棋盘：记录每格属于哪架飞机 & 是否机头；以及敌方(电脑)命中的格
let playerGrid = [];   // playerGrid[r][c] = {plane, type:'head'|'body'} | null
let playerShotByAI = []; // 'none'|'miss'|'body'|'head'
// 敌方棋盘：记录真实布局(隐藏)，玩家射击结果
let enemyGrid = [];
let enemyShotByPlayer = [];

// 电脑 AI
let aiTargets = [];
let lastPlayerShot = null;   // 玩家最后一次轰炸的格子 {r,c}
let lastAIShot = null;       // 电脑最后一次轰炸的格子 {r,c}

// ---- 音效（Web Audio，无需外部文件） ----
let audioCtx = null;
let soundOn = (BOOT.sound === true || BOOT.sound === false) ? !!BOOT.sound : true;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
}
function beep(freq, dur, type="sine", vol=0.16){
  if(!soundOn || !audioCtx) return;
  const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+dur+0.02);
}
function sweep(f1,f2,dur,type="sawtooth",vol=0.2){
  if(!soundOn || !audioCtx) return;
  const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(f1,t);
  osc.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+dur+0.02);
}
function explosion(vol=0.34, dur=0.38){
  if(!soundOn || !audioCtx) return;
  const t=audioCtx.currentTime;
  // 白噪声爆发，经低通滤波并快速衰减
  const bufSize=Math.floor(audioCtx.sampleRate*dur);
  const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i]=Math.random()*2-1;
  const noise=audioCtx.createBufferSource(); noise.buffer=buf;
  const filter=audioCtx.createBiquadFilter(); filter.type="lowpass";
  filter.frequency.setValueAtTime(1800,t);
  filter.frequency.exponentialRampToValueAtTime(180,t+dur);
  const ng=audioCtx.createGain();
  ng.gain.setValueAtTime(vol,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  noise.connect(filter).connect(ng).connect(audioCtx.destination);
  noise.start(t); noise.stop(t+dur);
  // 低频轰鸣（下扫）
  const osc=audioCtx.createOscillator(); osc.type="sine";
  osc.frequency.setValueAtTime(120,t);
  osc.frequency.exponentialRampToValueAtTime(38,t+dur*0.85);
  const og=audioCtx.createGain();
  og.gain.setValueAtTime(vol*0.9,t);
  og.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(og).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+dur+0.02);
}
const sfx = {
  place: ()=>beep(440,0.08,"triangle",0.12),
  rotate:()=>beep(330,0.06,"square",0.07),
  random:()=>{ beep(523,0.07,"triangle",0.1); setTimeout(()=>beep(659,0.07,"triangle",0.1),70); },
  clear: ()=>beep(200,0.12,"sine",0.1),
  miss:  ()=>beep(150,0.18,"sine",0.18),
  body:  ()=>explosion(),
  head:  ()=>{ // 多音符爆炸：爆炸底噪 + 上行琶音（方波）叠加
    explosion(0.36,0.45);
    [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.16,"square",0.14), i*70));
  },
  win:   ()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"triangle",0.18),i*120)); },
  lose:  ()=>{ [440,330,247,165].forEach((f,i)=>setTimeout(()=>beep(f,0.22,"sawtooth",0.16),i*140)); },
  start: ()=>{ // 多音符开场：G4→C5→E5→G5→C6 上行琶音，末音稍长
    const notes=[392,523,659,784,1046];
    notes.forEach((f,i)=>setTimeout(()=>beep(f, i===notes.length-1?0.32:0.14, "triangle",0.18), i*95));
  },
};

function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(null)); }
function emptyStrGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill("none")); }

function init(){
  applyStaticText();
  phase="setup"; rotation=0; placingIndex=0;
  playerPlanes=[]; enemyPlanes=[];
  playerGrid=emptyGrid(); playerShotByAI=emptyStrGrid();
  enemyGrid=emptyGrid(); enemyShotByPlayer=emptyStrGrid();
  aiTargets=[];
  lastPlayerShot=null; lastAIShot=null;
  document.getElementById("setupControls").style.display="flex";
  document.getElementById("battleControls").style.display="none";
  document.getElementById("enemyCard").style.display="none";   // 布局阶段不显示敌方战场
  document.getElementById("leftTitle").textContent=t('sp_left_title');
  document.getElementById("rightTitle").textContent=t('sp_right_unknown');
  setStatus(setupStatusText());
  document.getElementById("hint").textContent=t('sp_hint_setup');
  buildBoards();
  renderAll();
}

function setStatus(t){ document.getElementById("status").innerHTML=t; }

// ---- 构建 DOM ----
function buildBoards(){
  const pb=document.getElementById("playerBoard");
  const eb=document.getElementById("enemyBoard");
  pb.innerHTML=""; eb.innerHTML="";
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const pc=document.createElement("div");
      pc.className="cell"; pc.dataset.r=r; pc.dataset.c=c;
      pc.addEventListener("click",()=>onPlayerCellClick(r,c));
      pc.addEventListener("mouseenter",()=>onPlayerCellHover(r,c,true));
      pc.addEventListener("mouseleave",()=>onPlayerCellHover(r,c,false));
      pb.appendChild(pc);

      const ec=document.createElement("div");
      ec.className="cell"; ec.dataset.r=r; ec.dataset.c=c;
      ec.addEventListener("click",()=>onEnemyCellClick(r,c));
      eb.appendChild(ec);
    }
  }
}

function inBounds(r,c){ return r>=0&&r<SIZE&&c>=0&&c<SIZE; }

// 校验飞机是否可放在该机头位置
function canPlace(headR,headC,rot,ignoreIndex=-1){
  const cells=planeCells(headR,headC,rot);
  for(const [r,c] of cells){
    if(!inBounds(r,c)) return false;
    const occ=playerGrid[r][c];
    if(occ && occ.plane!==ignoreIndex) return false;
  }
  return true;
}

let hoverR=-1, hoverC=-1;   // 当前鼠标悬停的格子

function clearGhost(){
  document.querySelectorAll("#playerBoard .cell.ghost-ok, #playerBoard .cell.ghost-bad")
    .forEach(el=>el.classList.remove("ghost-ok","ghost-bad"));
}

// 在指定机头位置绘制/清除放置预览
function paintGhost(r,c){
  clearGhost();
  if(phase!=="setup"||placingIndex>=NUM_PLANES||r<0||c<0) return;
  const cells=planeCells(r,c,rotation);
  const ok=canPlace(r,c,rotation);
  for(const [rr,cc] of cells){
    if(!inBounds(rr,cc)) continue;
    const el=cellEl("playerBoard",rr,cc);
    el.classList.add(ok?"ghost-ok":"ghost-bad");
  }
}

function onPlayerCellHover(r,c,on){
  hoverR = on ? r : -1;
  hoverC = on ? c : -1;
  paintGhost(hoverR,hoverC);
}

function onPlayerCellClick(r,c){
  if(phase!=="setup"||placingIndex>=NUM_PLANES) return;
  ensureAudio();
  if(!canPlace(r,c,rotation)){
    setStatus(t('sp_place_invalid'));
    sfx.clear();
    return;
  }
  sfx.place();
  const cells=planeCells(r,c,rotation);
  const idx=placingIndex;
  cells.forEach(([rr,cc])=>{
    const type = (rr===r && cc===c) ? "head" : "body";
    playerGrid[rr][cc]={plane:idx,type};
  });
  playerPlanes.push({headR:r,headC:c,rot:rotation,cells,headHit:false});
  placingIndex++;
  if(placingIndex<NUM_PLANES){
    setStatus(setupStatusText());
  }else{
    setStatus(t('sp_all_placed'));
  }
  renderAll();
}

function onEnemyCellClick(r,c){
  if(phase!=="battle") return;
  if(enemyShotByPlayer[r][c]!=="none") return;
  ensureAudio();
  resolvePlayerShot(r,c);
  const res=enemyShotByPlayer[r][c];
  if(res==="miss") sfx.miss(); else if(res==="body") sfx.body(); else if(res==="head") sfx.head();
  lastPlayerShot={r,c};
  renderAll();
  if(checkWin()) return;
  // 电脑反击
  setTimeout(()=>{
    computerMove();
    renderAll();
    checkWin();
  },350);
}

// 解析玩家射击
function resolvePlayerShot(r,c){
  const g=enemyGrid[r][c];
  if(!g){
    enemyShotByPlayer[r][c]="miss";
  }else if(g.type==="head"){
    enemyShotByPlayer[r][c]="head";
    enemyPlanes[g.plane].headHit=true;
  }else{
    enemyShotByPlayer[r][c]="body";
  }
}

// ---- 电脑 AI ----
function computerPlacePlanes(){
  enemyPlanes=[];
  enemyGrid=emptyGrid();
  let idx=0;
  while(idx<NUM_PLANES){
    const rot=Math.floor(Math.random()*4);
    const hr=Math.floor(Math.random()*SIZE);
    const hc=Math.floor(Math.random()*SIZE);
    if(canPlaceEnemy(hr,hc,rot)){
      const cells=planeCells(hr,hc,rot);
      cells.forEach(([r,c])=>{
        const type=(r===hr&&c===hc)?"head":"body";
        enemyGrid[r][c]={plane:idx,type};
      });
      enemyPlanes.push({headR:hr,headC:hc,rot,cells,headHit:false});
      idx++;
    }
  }
}
function canPlaceEnemy(hr,hc,rot){
  const cells=planeCells(hr,hc,rot);
  for(const [r,c] of cells){
    if(!inBounds(r,c)) return false;
    if(enemyGrid[r][c]) return false;
  }
  return true;
}

function computerMove(){
  let cell=null;
  while(aiTargets.length){
    const [r,c]=aiTargets.shift();
    if(inBounds(r,c)&&playerShotByAI[r][c]==="none"){ cell=[r,c]; break; }
  }
  if(!cell){
    const options=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)
      if(playerShotByAI[r][c]==="none") options.push([r,c]);
    if(!options.length) return;
    cell=options[Math.floor(Math.random()*options.length)];
  }
  const [r,c]=cell;
  const g=playerGrid[r][c];
  if(!g){
    playerShotByAI[r][c]="miss";
  }else if(g.type==="head"){
    playerShotByAI[r][c]="head";
    playerPlanes[g.plane].headHit=true;
    // 命中机头，清除该飞机区域的目标
    aiTargets=aiTargets.filter(([tr,tc])=>{
      const tg=playerGrid[tr][tc];
      return !(tg&&tg.plane===g.plane);
    });
  }else{
    playerShotByAI[r][c]="body";
    // 加入相邻格作为候选
    [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{
      if(inBounds(nr,nc)&&playerShotByAI[nr][nc]==="none") aiTargets.push([nr,nc]);
    });
  }
  const res=playerShotByAI[r][c];
  if(res==="miss") sfx.miss(); else if(res==="body") sfx.body(); else if(res==="head") sfx.head();
  lastAIShot={r,c};
}

// ---- 胜负 ----
function checkWin(){
  const enemyHeadsLeft=enemyPlanes.filter(p=>!p.headHit).length;
  const myHeadsLeft=playerPlanes.filter(p=>!p.headHit).length;
  if(enemyHeadsLeft===0){
    phase="over";
    setStatus('<span class="win win-yes">' + t('sp_win') + '</span>');
    sfx.win();
    revealEnemy();
    return true;
  }
  if(myHeadsLeft===0){
    phase="over";
    setStatus('<span class="win win-no">' + t('sp_lose') + '</span>');
    sfx.lose();
    revealEnemy();
    return true;
  }
  return false;
}

function revealEnemy(){
  // 展示敌方全部飞机
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(enemyGrid[r][c] && enemyShotByPlayer[r][c]==="none"){
      enemyShotByPlayer[r][c]="reveal";
    }
  }
  document.getElementById("rightTitle").textContent=t('sp_reveal');
  renderAll();   // 重新渲染，真正把敌方飞机显示出来
}

// ---- 渲染 ----
function cellEl(boardId,r,c){
  return document.querySelector(`#${boardId} .cell[data-r="${r}"][data-c="${c}"]`);
}
// 重置为干净格子（保留内部 tile，避免点击死区）
function clearCellClasses(el){ el.className="cell"; el.innerHTML='<div class="tile"></div>'; }
function setCell(el, cls, withDot){
  el.className="cell"+(cls?" "+cls:"");
  el.innerHTML='<div class="tile"></div>'+(withDot?'<span class="dot">头</span>':'');
}

function renderAll(){
  const showHeadLabel = (phase==="setup");   // 仅布局阶段在红色机头上显示「头」字
  // 我方棋盘
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const el=cellEl("playerBoard",r,c);
    const g=playerGrid[r][c];
    const shot=playerShotByAI[r][c];
    if(shot!=="none"){
      if(shot==="miss") setCell(el,"miss");
      else if(shot==="body") setCell(el,"body");
      else if(shot==="head") setCell(el,"hit-head",showHeadLabel);
    }else if(g){
      setCell(el, g.type==="head"?"head":"plane", g.type==="head" && showHeadLabel);
    }else{
      setCell(el,null);
    }
    if(lastAIShot && lastAIShot.r===r && lastAIShot.c===c && shot!=="none") el.classList.add("last-shot");
  }
  // 敌方棋盘（战争迷雾）
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const el=cellEl("enemyBoard",r,c);
    const s=enemyShotByPlayer[r][c];
    if(s==="miss") setCell(el,"miss");
    else if(s==="body") setCell(el,"body");
    else if(s==="head") setCell(el,"hit-head",showHeadLabel);
    else if(s==="reveal"){
      // 揭晓：按真实布局显示敌方飞机（绿机身/红机头，无「头」字、无叉叉）
      const g=enemyGrid[r][c];
      setCell(el, g && g.type==="head" ? "head" : "body");
    }
    else setCell(el,null);
    if(lastPlayerShot && lastPlayerShot.r===r && lastPlayerShot.c===c && s!=="none") el.classList.add("last-shot");
  }
  // 更新信息
  if(phase==="battle"||phase==="over"){
    const eLeft=enemyPlanes.filter(p=>!p.headHit).length;
    const mLeft=playerPlanes.filter(p=>!p.headHit).length;
    if(phase!=="over")
      setStatus(t('sp_status_battle', { e: '<b>' + eLeft + '</b>', m: '<b>' + mLeft + '</b>' }));
  }
  // 布局阶段：根据当前悬停格重绘放置预览（旋转/放置后无需移动鼠标即可更新）
  paintGhost(hoverR,hoverC);
}

// ---- 控制按钮 ----
document.getElementById("btnRotate").addEventListener("click",()=>{
  ensureAudio(); sfx.rotate();
  rotation=(rotation+1)%4; renderAll();
});
document.getElementById("btnRandom").addEventListener("click",()=>{
  ensureAudio(); sfx.random();
  playerPlanes=[]; playerGrid=emptyGrid(); placingIndex=0; rotation=0;
  let idx=0, guard=0;
  while(idx<NUM_PLANES && guard<5000){
    guard++;
    const rot=Math.floor(Math.random()*4);
    const hr=Math.floor(Math.random()*SIZE);
    const hc=Math.floor(Math.random()*SIZE);
    if(canPlace(hr,hc,rot)){
      const cells=planeCells(hr,hc,rot);
      cells.forEach(([r,c])=>{
        const type=(r===hr&&c===hc)?"head":"body";
        playerGrid[r][c]={plane:idx,type};
      });
      playerPlanes.push({headR:hr,headC:hc,rot,cells,headHit:false});
      idx++;
    }
  }
  placingIndex=NUM_PLANES;
  setStatus(t('sp_random_done'));
  renderAll();
});
document.getElementById("btnClear").addEventListener("click",()=>{
  ensureAudio(); sfx.clear();
  playerPlanes=[]; playerGrid=emptyGrid(); placingIndex=0; rotation=0;
  setStatus(t('sp_cleared'));
  renderAll();
});
document.getElementById("btnConfirm").addEventListener("click",()=>{
  ensureAudio();
  if(placingIndex<NUM_PLANES){
    setStatus(t('sp_not_enough', { n: (NUM_PLANES - placingIndex) }));
    return;
  }
  startBattle();
});
document.getElementById("btnRestart").addEventListener("click",()=>{ ensureAudio(); init(); });
document.addEventListener("keydown",(e)=>{
  if(phase==="setup" && (e.key==="r"||e.key==="R")){
    ensureAudio(); sfx.rotate();
    rotation=(rotation+1)%4; renderAll();
  }
});
window.addEventListener('message', function(e){
  const m = e.data; if(!m) return;
  if(m.type==='lang'){ curLang = (m.lang==='en')?'en':'cn'; curDict = (curLang==='en')?BOOT.dictEn:BOOT.dictCn; relocalize(); }
  else if(m.type==='sound'){ soundOn = !!m.on; updateSoundBtn(); }
});

function startBattle(){
  phase="battle";
  sfx.start();   // 游戏开始：多音符开场音效
  computerPlacePlanes();
  document.getElementById("setupControls").style.display="none";
  document.getElementById("battleControls").style.display="flex";
  document.getElementById("enemyCard").style.display="";   // 开战后显示敌方战场
  document.getElementById("leftTitle").textContent=t('sp_my_attacking');
  document.getElementById("rightTitle").textContent=t('sp_enemy_bomb');
  document.getElementById("hint").textContent=t('sp_hint_battle');
  renderAll();
}

init();
</script>
</body>
